version: '3.8'

services:
  # Nginx (ya existente, actualización)
  proxy_nginx:
    image: nginx:alpine
    container_name: proxy_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Configuración Nginx
      - ./nginx.conf.chatwoot:/etc/nginx/conf.d/chatwoot.conf:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      
      # Certificados SSL/TLS
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/etc/letsencrypt/webrootpath:rw
      
      # Logs
      - ./nginx_logs:/var/log/nginx
    
    networks:
      - app_network
    
    depends_on:
      - chatwoot_rails
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    restart: unless-stopped

  # Certbot (para renovar certificados Let's Encrypt)
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/letsencrypt:/var/www/letsencrypt
    
    # Renovar certificados cada 12 horas
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/letsencrypt --quiet; sleep 12h & wait $${!}; done'
    
    networks:
      - app_network
    
    restart: unless-stopped

networks:
  app_network:
    external: true
